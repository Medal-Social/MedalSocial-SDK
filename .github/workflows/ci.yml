name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # lcov paths are package-relative (src/…); Codecov's path fixing maps
          # them onto packages/<name>/src.
          files: ./packages/sdk/coverage/lcov.info,./packages/booking/coverage/lcov.info
          fail_ci_if_error: false

  # The same unit suite on the OTHER Node line `engines.node` admits, so the
  # ">=22" claim is proved rather than asserted. A separate job (not a matrix
  # on `test`) because `prod`'s ruleset requires a context named exactly
  # `test`, which a matrix would rename to `test (22)`. When the floor moves,
  # move this matrix with it — `engines.node` alone proves nothing.
  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      # Every package: typecheck, build and entry-point verification fan out
      # over packages/*. The OpenAPI steps and the version sync are SDK-only.
      - run: pnpm typecheck

      - run: pnpm --filter @medalsocial/sdk run version:check

      - run: pnpm --filter @medalsocial/sdk run openapi:lint

      - run: pnpm build

      - run: pnpm --filter @medalsocial/sdk run openapi:coverage

      - run: pnpm -r --filter './packages/*' run verify:paths

      # Bundle-size budgets for @medalsocial/booking (built output, esbuild +
      # gzip, peers external). Raising one needs a written reason in the PR.
      - run: pnpm --filter @medalsocial/booking run size:budget

      # JSR validates the package on rules npm, tsc, tsdown and verify:paths never
      # see: it rejects "slow types" (a public-API symbol with no explicit type)
      # and enforces jsr.json's publish scope. release.yml publishes JSR in its
      # own step AFTER npm, so a JSR-only error used to surface mid-release and
      # leave npm and JSR on different versions. 1.11.0 would have done exactly
      # that: MedalTimeoutError's constructor had an untyped default parameter.
      # This runs the real CLI in dry-run mode so the PR fails instead. It must
      # be `jsr publish --dry-run` itself - `pnpm jsr:publish --dry-run` only
      # reports what it would do and never runs the checks.
      #
      # JSR carries @medalsocial/sdk only, so the check runs in its directory.
      - name: JSR package check (slow types, publish scope)
        working-directory: packages/sdk
        run: pnpm exec jsr publish --dry-run --allow-dirty

  # The booking package's smoke target: a minimal Next 16 app on
  # @medalsocial/booking/next against a mock Medal. `next build`, a check that
  # no server-only code (or the key) reached a client chunk, then a Playwright
  # run that books one service end to end on plain `next start`.
  example-next-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      # The key is in the build environment, so a key that leaked into a
      # client chunk (inlined at build time) would be caught by check:client.
      - run: pnpm --filter medalsocial-example-next-booking run build
        env:
          MEDAL_API_KEY: sk_example
          MEDAL_API_ENDPOINT: http://localhost:3101

      - run: pnpm --filter medalsocial-example-next-booking run check:client

      - run: pnpm --filter medalsocial-example-next-booking exec playwright install --with-deps chromium

      - run: pnpm --filter medalsocial-example-next-booking run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm secret:scan

      - run: pnpm knip:check
