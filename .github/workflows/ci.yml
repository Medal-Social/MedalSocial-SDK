name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The same unit suite on the OTHER Node line `engines.node` admits, so the
  # ">=22" claim is proved rather than asserted. A separate job (not a matrix
  # on `test`) because `prod`'s ruleset requires a context named exactly
  # `test`, which a matrix would rename to `test (22)`. When the floor moves,
  # move this matrix with it — `engines.node` alone proves nothing.
  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm run version:check

      - run: pnpm openapi:lint

      - run: pnpm build

      - run: pnpm openapi:coverage

      - run: pnpm verify:paths

      # JSR validates the package on rules npm, tsc, tsdown and verify:paths never
      # see: it rejects "slow types" (a public-API symbol with no explicit type)
      # and enforces jsr.json's publish scope. release.yml publishes JSR in its
      # own step AFTER npm, so a JSR-only error used to surface mid-release and
      # leave npm and JSR on different versions. 1.11.0 would have done exactly
      # that: MedalTimeoutError's constructor had an untyped default parameter.
      # This runs the real CLI in dry-run mode so the PR fails instead. It must
      # be `jsr publish --dry-run` itself - `pnpm jsr:publish --dry-run` only
      # reports what it would do and never runs the checks.
      - name: JSR package check (slow types, publish scope)
        run: pnpm exec jsr publish --dry-run --allow-dirty

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm secret:scan

      - run: pnpm knip:check
