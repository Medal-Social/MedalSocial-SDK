name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm openapi:lint

      - run: pnpm build

      - run: pnpm openapi:coverage

      - run: pnpm verify:paths

  # Typecheck (tsgo shadow) — ADVISORY ONLY, never a required context and never
  # gating. TypeScript 7 is the native port; `tsc --noEmit` already passes on
  # this repo under it, so this job exists to tell us when that stops being
  # true, not to speed anything up (tsc is ~2s here — there is no wall-time
  # win to chase, unlike the monorepo's 130s -> 20s).
  #
  # It is deliberately NOT a step towards making TS 7 the project compiler.
  # That is blocked outside our code: TS 7 ships without the legacy JS compiler
  # API, so openapi-typescript (ts.factory), typedoc (ts.SyntaxKind) and tsup's
  # vendored rollup-plugin-dts (ts.sys) all crash on it — the last of which
  # takes out the published .d.ts. Watch for those three to adopt
  # `@typescript/typescript6` (rollup-plugin-dts 6.5.1 already peers on it).
  #
  # A red verdict here means our own source drifted away from TS 7, which is
  # worth knowing early and is never a reason to fail the build.
  typecheck-native-shadow:
    name: Typecheck (tsgo shadow, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - name: Run tsgo --noEmit on both configs (timed)
        run: |
          # NOTE: no step-level continue-on-error. This step is MEANT to go red
          # when TS 7 rejects our source — that red is the entire signal. The
          # job-level continue-on-error above is what keeps it non-gating, so
          # a red job here never fails the workflow or blocks a merge.
          #
          # `--package=` selects what to install; `tsc` after it is the binary to
          # run. Do NOT collapse this to `pnpm dlx typescript@7 ...`: that form
          # only works while the package exposes exactly one bin, so pnpm can
          # infer it. typescript@7.0.2 does (`{"tsc": "bin/tsc"}`) — but 6.x
          # ships `tsc` AND `tsserver`, and the spec below is unpinned within
          # 7.x on purpose, so any 7.x that adds a second bin would break the
          # inference with ERR_PNPM_DLX_MULTIPLE_BINS. Since this step no longer
          # swallows failures, that would surface as a permanent red job and
          # read as TS 7 drift when it is really a broken installer.
          #
          # Equally, do not write the bin without `--package=`: a bare trailing
          # token is treated as a source file and dies with TS5042 ("'project'
          # cannot be mixed with source files").
          #
          # Unpinned within 7.x on purpose: the point is to track the newest
          # TS 7. pnpm 11 quarantines releases younger than 24h, so a very
          # fresh 7.x can make this step fail to install — which is advisory
          # too, and indistinguishable from drift only until you read the log.
          SUMMARY=$(mktemp)

          run_one() {
            local cfg="$1" start
            start=$(date +%s)
            # tsgo's own output goes to the job log, not the step summary.
            if pnpm dlx --package=typescript@7 tsc --noEmit -p "$cfg"; then
              echo "- \`$cfg\`: clean in $(($(date +%s) - start))s" >> "$SUMMARY"
            else
              echo "- \`$cfg\`: **ERRORS** in $(($(date +%s) - start))s" >> "$SUMMARY"
              return 1
            fi
          }

          {
            echo "### tsgo shadow (TypeScript 7, advisory)"
            echo ""
          } > "$SUMMARY"

          # Deliberately NOT inside a `{ ... } | tee` group: that runs in a
          # subshell, so the verdict assignments below would be discarded and
          # the step could never report drift.
          verdict=clean
          run_one tsconfig.json || verdict=errors
          run_one tsconfig.test.json || verdict=errors

          {
            echo ""
            echo "verdict: **$verdict** (tsc 6 baseline for the same two configs: ~2s in the build job)"
            if [ "$verdict" = errors ]; then
              echo ""
              echo "Our source drifted from TypeScript 7. This job is red on purpose; nothing is gated by it."
            fi
          } >> "$SUMMARY"

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY"

          # Propagate the verdict so the job actually turns red on drift.
          [ "$verdict" = clean ]

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - run: pnpm secret:scan

      - run: pnpm knip:check
