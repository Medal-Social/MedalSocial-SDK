name: Request changeset

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [dev]

permissions: {}

jobs:
  request:
    if: |
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check if changeset needed
        id: check
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)

          HAS_CHANGESET=$(echo "$CHANGED" | grep -c '^\.changeset/.*\.md$' || true)
          # Published source lives in packages/<dir>/src. Name each package
          # whose source changed, read from its own package.json.
          PACKAGES=$(echo "$CHANGED" | sed -nE 's#^packages/([^/]+)/src/.*#\1#p' | sort -u \
            | while read -r dir; do
                if [[ -f "packages/$dir/package.json" ]]; then node -p "require('./packages/$dir/package.json').name"; fi
              done \
            | paste -sd, - | sed 's/,/, /g')

          if [[ "$HAS_CHANGESET" -eq 0 && -n "$PACKAGES" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Remind contributor to add a changeset
        if: steps.check.outputs.needed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGES: ${{ steps.check.outputs.packages }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `This PR changes the source of ${process.env.PACKAGES} but has no changeset.`,
                '',
                'Please add a `.changeset/<descriptive-name>.md` file with:',
                '- The correct bump type (`patch`, `minor`, or `major`)',
                `- Package(s) in scope: ${process.env.PACKAGES}`,
                '- A concise, user-facing summary (not implementation details)',
                '',
                'Follow the format of existing files in `.changeset/`. See https://github.com/changesets/changesets for details.',
              ].join('\n')
            });
