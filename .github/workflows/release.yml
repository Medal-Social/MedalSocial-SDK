name: Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Git pushes and release PRs use the app token (steps.app-token), not
      # GITHUB_TOKEN — read suffices here; provenance needs id-token + attestations.
      contents: read
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality

      # v2 reads the packages Changesets published from the structured
      # CHANGESETS_OUTPUT file instead of scraping "New tag:" out of stdout.
      # Changesets v3 no longer prints that line, so v1.7.0 silently found no
      # released packages and skipped every tag push and GitHub release from
      # 1.7.0 onwards. v2 also pushes tags and creates releases *before* it
      # honours the publish script's exit code, so a failure in a later publish
      # target can no longer swallow them.
      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # JSR is a second registry, published after npm and after the tag and
      # GitHub release exist. It runs on its own so a JSR-side failure cannot
      # take the npm release with it.
      #
      # Skipped while changesets are pending (`has-changesets` is "true"). That
      # run only opens or updates the version PR, and the action leaves its
      # version bump UNCOMMITTED in this checkout: jsr.json already names the
      # unreleased version, so `pnpm jsr:publish` finds it missing from JSR and
      # tries to publish it — before the version PR is merged and before npm.
      # On 2026-09-13 (run 34762727405) only deno's refusal to publish a dirty
      # tree stopped 1.11.0 going out that way.
      #
      # Deliberately not gated on `steps.changesets.outputs.published`: on a
      # re-run npm already has the version, so Changesets publishes nothing and
      # that output is "false" — which would skip the very step the re-run
      # exists to retry. `has-changesets` is "false" on that re-run, and
      # `pnpm jsr:publish` asks the registry itself and exits 0 in ~1s when the
      # version is already there.
      #
      # It still does not run when an earlier step fails: a failed npm publish
      # should not reach JSR.
      #
      # Only @medalsocial/sdk is published to JSR, hence the filter.
      - name: Publish to JSR
        if: steps.changesets.outputs.has-changesets != 'true'
        run: pnpm --filter @medalsocial/sdk run jsr:publish
