# check-skills.yml — TanStack Intent skill validation + coverage review.
#
# Generated by `npx @tanstack/intent setup`, then edited to match sdk's
# existing CI conventions:
#   - SHA-pinned actions
#   - pnpm with frozen lockfile, node 24
#   - `pnpm exec intent` against the locally-pinned @tanstack/intent
#   - Least-privilege permissions (workflow-level read-only; review job
#     elevates to write only where needed)
#   - Public-repo compliance: uses GITHUB_TOKEN, NOT a GitHub App token.
#     Per sdk CLAUDE.md, this repo must not introduce internal Medal
#     Social infrastructure references. The tradeoff is that the review
#     PR opened by this job is attributed to github-actions[bot] and
#     will NOT cascade to downstream workflows. That is acceptable
#     because the review job is non-blocking and a maintainer always
#     touches the PR before any release action is taken.
#
# Triggers:
#   - PRs touching skills/** or _artifacts/** → blocking validate job
#   - Releases or manual dispatch → non-blocking stale/coverage review
#
# intent-workflow-version: 3

name: Check Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '**/skills/**'
      - '_artifacts/**'
      - '**/_artifacts/**'
  release:
    types: [published]
  workflow_dispatch: {}

# Default to read-only. Each job elevates only what it needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate intent skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - name: Validate skills
        run: pnpm exec intent validate --github-summary

  review:
    name: Check intent skill coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Job-scoped write perms for GITHUB_TOKEN — needed to push the
    # review branch and open/edit the PR. Workflow-level stays at
    # contents: read so the validate job (and any future job) does
    # not inherit these.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - name: Check skills
        id: stale
        run: pnpm exec intent stale --github-review --package-label "@medalsocial/sdk"

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name || 'manual' }}"
          BRANCH="skills/review-${VERSION}"
          BASE_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Always make a fresh empty commit + push, whether the branch
          # is new or already exists. The previous early-return on
          # already-exists meant re-runs silently skipped pushing, so
          # the review PR went stale across re-releases / re-dispatches.
          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          git commit --allow-empty -m "chore: review intent skills for ${VERSION}"
          git push origin "$BRANCH"

          # `--jq '.[0].url'` emits the literal string "null" when no
          # PR exists for this head, which previously made the `-n`
          # guard below pass and triggered `gh pr edit null`. The
          # `// empty` fallback returns an empty string in that case
          # so the create path runs.
          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
          else
            gh pr create \
              --title "Review intent skills (${VERSION})" \
              --body-file pr-body.md \
              --head "$BRANCH" \
              --base "$BASE_BRANCH"
          fi
