name: Auto Approve

on:
  pull_request_target:
    branches: [dev]

permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]' ||
      github.actor == 'medal-social-release-bot[bot]'
    steps:
      - name: Generate token from Medal Bot app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v4
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: hmarr/auto-approve-action@05a696a09d381a5a0d142c755f7eacbb19eb6525 # v4
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge for release PRs
        if: github.actor == 'medal-social-release-bot[bot]'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
