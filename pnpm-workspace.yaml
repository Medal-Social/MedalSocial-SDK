packages:
  - "packages/*"
  - "examples/*"

# Transitive security floors. Drop an entry once every parent resolves the
# patched version on its own.
overrides:
  js-yaml: 4.3.2   # GHSA-2883-xcg3-v3hh, via @commitlint/cli and openapi-typescript
  sharp@<0.35.5: ^0.35.5            # GHSA-wq5f-xc86-pv6w, GHSA-rgj7-g3m4-5g8c, via next
  shell-quote@<1.11.0: ^1.11.0      # GHSA-pqg4-j6r4-53mv
  source-map-js@<1.2.2: ^1.2.2      # GHSA-68fv-2mgg-jv7q
  undici@>=7.0.0 <7.29.1: ^7.29.1   # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-4cwx-7wf7-3272

# Neither package needs its lifecycle scripts to install correctly, and running
# them would execute third-party code at install time.
allowBuilds:
  '@medalsocial/sdk': false
  esbuild: false
  # Miniflare's runtime (booking's Workers cache-adapter test). Its binary
  # arrives as an optional dependency; the install script is not needed.
  workerd: false

# First-party: meda is released from Medal-Social/meda; the booking package
# tracks its booking screens release by release, inside the age window.
minimumReleaseAgeExclude:
  - '@medalsocial/meda@3.6.0'
