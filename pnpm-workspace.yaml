packages:
  - "."
  - "examples/*"

# Only one override survives. Everything else this file used to pin now
# resolves to the patched version on its own.
overrides:
  js-yaml: 4.3.2   # GHSA-2883-xcg3-v3hh, via @commitlint/cli and openapi-typescript

# Neither package needs its lifecycle scripts to install correctly, and running
# them would execute third-party code at install time.
allowBuilds:
  '@medalsocial/sdk': false
  esbuild: false
