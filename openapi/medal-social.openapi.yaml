    ApiResponse_BookingEventRemoveResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BookingEventRemoveResult"
    ApiResponse_PortalVippsStart:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PortalVippsStart"
    ApiResponse_PortalVippsSession:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PortalVippsSession"
    ApiResponse_ConversationContactLinkResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ConversationContactLinkResult"
    ApiResponse_ConversationContactUnlinkResult:
      type: object
      required: [data]
      properties:
        data:
