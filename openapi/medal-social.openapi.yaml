    BookingRevenueProvider:
      description: Where the money on one local day came from.
      type: string
      enum: [in_house, vipps]
    BookingRevenueByProvider:
      type: object
      required: [provider, amount_ore, count]
      properties:
        provider:
          $ref: "#/components/schemas/BookingRevenueProvider"
        amount_ore:
          type: integer
          description: Integer øre.
        count:
          type: integer
    BookingNextGap:
      description: The next stretch a resource is free.
      type: object
      required: [resource_id, start_minute, end_minute, start_ts]
      properties:
        resource_id:
          type: string
        start_minute:
          type: integer
          description: Minutes since midnight in the workspace time zone.
        end_minute:
          type: integer
        start_ts:
          type: string
          format: date-time
    BookingsToday:
      description: The salon's operating summary for one local date.
      type: object
      required:
        - date_key
        - time_zone
        - opens_minute
        - closes_minute
        - closed_for_today
        - next_open
        - on_duty_count
        - total
        - completed
        - remaining
        - no_show
        - cancelled
        - next_gap
        - revenue
        - truncated
      properties:
        date_key:
          type: integer
          description: "`yyyymmdd` in the workspace time zone."
        time_zone:
          type: string
          description: IANA zone the minute fields are counted in.
        opens_minute:
          type: [integer, "null"]
        closes_minute:
          type: [integer, "null"]
        closed_for_today:
          type: boolean
          description: >-
            Past the last opening window of a day that DID open. A day nobody
            works at all is `opens_minute: null` with `on_duty_count: 0`.
        next_open:
          description: Set only alongside `closed_for_today`.
          type: ["object", "null"]
          required: [start_ts]
          properties:
            start_ts:
              type: string
              format: date-time
        on_duty_count:
          type: integer
        total:
          type: integer
        completed:
          type: integer
        remaining:
          type: integer
        no_show:
          type: integer
        cancelled:
          type: integer
        next_gap:
          oneOf:
            - $ref: "#/components/schemas/BookingNextGap"
            - type: "null"
        revenue:
          type: object
          required: [total_ore, by_provider]
          properties:
            total_ore:
              type: integer
              description: Integer øre.
            by_provider:
              type: array
              items:
                $ref: "#/components/schemas/BookingRevenueByProvider"
        truncated:
          type: boolean
          description: A source hit its read cap, so the counts are floors.
    BookingAttentionKind:
      description: What kind of open item needs a human.
      type: string
      enum:
        - payment_failed
        - payment_released
        - payment_partial_capture
        - waitlist_offer_expiring
        - event_consent_missing
        - booking_attachment
        - no_show_today
    BookingAttentionItem:
      description: >-
        One «Trenger deg» item. No prose crosses the wire — render the sentence
        from `kind`. Absent optional fields answer `null`, so one shape
        destructures for every kind.
      type: object
      required:
        - id
        - kind
        - occurred_at
        - booking_id
        - event_id
        - contact_id
        - resource_id
        - amount_ore
        - count
        - deadline_at
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/BookingAttentionKind"
        occurred_at:
          type: [string, "null"]
          format: date-time
        booking_id:
          type: [string, "null"]
        event_id:
          type: [string, "null"]
        contact_id:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        amount_ore:
          type: [integer, "null"]
          description: Integer øre.
        count:
          type: [integer, "null"]
        deadline_at:
          type: [string, "null"]
          format: date-time
    BookingAttentionFeed:
      description: >-
        The attention feed and its own envelope. `truncated` is a read budget,
        not a cursor; `total` is exact only while it is false.
      type: object
      required: [data, truncated, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookingAttentionItem"
        truncated:
          type: boolean
        total:
          type: integer
    BookingEventHost:
      description: A place an arrangement is held.
      type: object
      required: [id, name, slug, address, note, retired]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: Stable public URL segment; never changes after creation.
        address:
          type: [string, "null"]
        note:
          type: [string, "null"]
          description: The half-sentence an address cannot carry («inngang B»).
        retired:
          type: boolean
    CreateBookingEventHostInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 200
        note:
          type: string
          maxLength: 200
    UpdateBookingEventHostInput:
      description: >-
        At least one field. `null` erases `address`/`note`; an omitted key
        leaves the stored value alone.
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: [string, "null"]
          maxLength: 200
        note:
          type: [string, "null"]
          maxLength: 200
        retired:
          type: boolean
    BookingEventRemoveResult:
      type: object
      required: [success, mode]
      properties:
        success:
          type: boolean
        mode:
          type: string
          enum: [hard, soft]
          description: >-
            `hard` when the row itself was removed, `soft` when cancelled
            registrations still point at it and it was kept as a tombstone.
    PortalVippsStartInput:
      type: object
      required: [return_url]
      properties:
        return_url:
          type: string
          maxLength: 2048
          description: >-
            An `https` URL under one of the workspace's own sites.
    PortalVippsStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          description: >-
            Send the customer here unchanged; it carries a one-time state.
    PortalVippsExchangeInput:
      type: object
      required: [grant]
      properties:
        grant:
          type: string
          maxLength: 128
          description: The single-use grant the callback appended to your return URL.
    PortalVippsSession:
      description: A portal session minted from a Vipps login.
      type: object
      required: [session_token, expires_at, expires_at_iso]
      properties:
        session_token:
          type: string
        expires_at:
          type: integer
          description: Unix timestamp in milliseconds.
        expires_at_iso:
          type: string
          format: date-time
    LinkConversationContactInput:
      description: Exactly one of `contact_id` or `email`.
      type: object
      oneOf:
        - required: [contact_id]
        - required: [email]
      properties:
        contact_id:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 320
    ConversationContactLinkResult:
      type: object
      required:
        - conversation_id
        - contact_id
        - previous_contact_id
        - contact_link_source
        - contact_linked_at
        - conversations_updated
      properties:
        conversation_id:
          type: string
        contact_id:
          type: string
        previous_contact_id:
          type: [string, "null"]
        contact_link_source:
          type: string
          enum: [partner]
        contact_linked_at:
          type: integer
          description: Unix timestamp in milliseconds.
        conversations_updated:
          type: integer
          description: >-
            How many of this sender's threads now carry the contact — the link
            is per sender, not per conversation.
    ConversationContactUnlinkResult:
      type: object
      required: [conversation_id, unlinked, previous_contact_id, conversations_updated]
      properties:
        conversation_id:
          type: string
        unlinked:
          type: boolean
          description: "`false` when the thread carried no contact to begin with."
        previous_contact_id:
          type: [string, "null"]
        conversations_updated:
          type: integer
    ApiResponse_BookingsToday:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BookingsToday"
    ApiResponse_BookingEventHostArray:
