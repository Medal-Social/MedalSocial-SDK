      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 320
        phone:
          type: string
          maxLength: 40
    RegisterBookingEventChildInput:
      description: The child being registered. Birth year, not a birthdate.
      type: object
      required: [name, birth_year]
      properties:
        name:
          type: string
          maxLength: 120
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2200
    RegisterBookingEventInput:
      description: Body for `registerBookingEvent`.
      type: object
      required: [guardian, child, service_id, consent_accepted]
      properties:
        guardian:
          $ref: "#/components/schemas/RegisterBookingEventGuardianInput"
        child:
          $ref: "#/components/schemas/RegisterBookingEventChildInput"
        service_id:
          type: string
        note:
          type: string
          maxLength: 5000
        consent_accepted:
          description: >-
            Must be literally `true`. The guardian has to actively consent
            before the registration is recorded, so omitting it or sending
            `false` is a 400.
          const: true
          type: boolean
        consent_version:
          description: >-
            Your own version label for the consent wording shown; defaults
            server-side to `event-consent-v1`.
          type: string
          minLength: 1
          maxLength: 64
        consent_text:
          description: The exact wording shown, stored on the consent record.
          type: string
          maxLength: 2000
        return_url:
          description: >-
            Where the wallet returns the guardian, when the registration
            starts a payment. Must be a URL one of this workspace's own sites
            vouches for; anything else answers 422.
          type: string
          minLength: 1
          maxLength: 2048
