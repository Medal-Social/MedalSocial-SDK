          $ref: "#/components/schemas/BookingStatus"
        start_ts:
          description: >-
            Unix timestamp in MILLISECONDS — unlike `/api/v1/bookings/*`, where
            `start_ts` is an ISO 8601 string. Both forms are answered here: this
            and `start_ts_iso`.
          type: integer
        end_ts:
          type: integer
          description: Unix timestamp in milliseconds.
        start_ts_iso:
          type: string
          format: date-time
        end_ts_iso:
          type: string
          format: date-time
        service_id:
          type: [string, "null"]
        service_name:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        resource_name:
          type: [string, "null"]
        booked_for_name:
          type: [string, "null"]
        amount_ore:
          type: [integer, "null"]
          description: Integer øre, or `null` when the service has no price.
