    CreateBookingInput:
      type: object
      required: [items, contact]
      properties:
        items:
          description: >-
            A PARTY — one request books a whole family in one all-or-nothing
            transaction.
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CreateBookingItemInput"
