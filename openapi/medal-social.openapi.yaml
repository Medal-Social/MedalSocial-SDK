    PortalBooking:
      type: object
      required:
        - booking_id
        - status
        - start_ts
        - end_ts
        - start_ts_iso
        - end_ts_iso
        - service_id
        - service_name
        - resource_id
        - resource_name
        - booked_for_name
        - amount_ore
