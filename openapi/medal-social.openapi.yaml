        conversation_id:
          type: string
        status:
          type: string
          const: created
    WebhookSubscribableEventType:
      description: >-
        The event types an endpoint can subscribe to — every delivery type
        except `test.ping`, which is only ever queued by the test route. Any
        other string in `event_types` is a 400.
      type: string
      enum:
        - helpdesk.conversation_created
        - helpdesk.conversation_assigned
        - helpdesk.conversation_status_changed
        - helpdesk.message_received
        - helpdesk.message_sent
        - helpdesk.message_delivery_updated
        - helpdesk.message_deleted
        - helpdesk.conversation_contact_linked
        - helpdesk.conversation_contact_unlinked
        - helpdesk.channel_connected
        - helpdesk.channel_disconnected
    WebhookEndpoint:
      type: object
      required:
        - id
        - name
        - url
        - enabled
        - event_types
        - channels
        - channel_connection_ids
        - secret_last4
        - consecutive_failures
        - last_delivery_at
        - last_success_at
        - last_error_at
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
          description: Destination URL (must be https).
        enabled:
          type: boolean
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscribableEventType"
          description: Subscribed event types. Empty array = all events.
        channels:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/HelpdeskChannel"
          description: >-
            Channel-type filter (e.g. `['widget', 'whatsapp']`), or `null` for
            all channels.
        channel_connection_ids:
          type: [array, "null"]
          items:
            type: string
          description: Channel-connection filter, or `null` for all connections.
        secret_last4:
          type: string
          description: Last 4 characters of the signing secret, for identification.
        consecutive_failures:
          type: integer
        last_delivery_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_success_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_error_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_error:
          type: [string, "null"]
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
        updated_at:
          type: integer
          description: Unix timestamp in milliseconds.
        secret:
          type: string
          description: >-
            Full signing secret (`whsec_…`) — present ONLY in the create
            response, exactly once. It can never be retrieved again; store it
            securely immediately. An idempotent replay of the create request
            omits it.
    CreateWebhookInput:
      type: object
      required: [name, url, event_types]
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
          description: Destination URL — must be https.
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscribableEventType"
          description: >-
            Event types to subscribe to (e.g. `helpdesk.message_received`).
            Empty = all; an unknown type is a 400.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/HelpdeskChannel"
          description: Restrict to these channel types (e.g. `['widget', 'whatsapp']`); an unknown channel is a 400.
        channel_connection_ids:
          type: array
          items:
            type: string
          description: Restrict to these channel connection IDs.
    UpdateWebhookInput:
      type: object
      description: Only provided fields change.
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscribableEventType"
        channels:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/HelpdeskChannel"
          description: New channel-type filter, or `null` to clear the filter.
        channel_connection_ids:
          type: [array, "null"]
          items:
            type: string
          description: New channel-connection filter, or `null` to clear the filter.
        enabled:
          type: boolean
    WebhookDeleteResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          const: deleted
    WebhookDelivery:
      type: object
      description: >-
        A delivery attempt record. `id` is the same value sent as the
        `X-Medal-Delivery-Id` and `Idempotency-Key` headers on the outbound
        request. Deliveries never carry payload bodies (payloads can contain
        customer PII). The correlation fields are derived from the stored event
        and fail closed to `null` when no canonical event exists — e.g.
        `test.ping` deliveries or events that have aged out of retention.
      required:
        - id
        - event_type
        - resource_id
        - conversation_id
        - message_id
        - connection_ref
        - channel
        - channel_connection_id
        - status
        - attempt_count
        - next_attempt_at
        - response_status
        - duration_ms
        - last_error
        - delivered_at
        - created_at
      properties:
        id:
          type: string
        event_type:
          type: string
        resource_id:
          type: [string, "null"]
          description: Primary subject id of the announced event, or `null`.
        conversation_id:
          type: [string, "null"]
        message_id:
          type: [string, "null"]
        connection_ref:
          type: [string, "null"]
        channel:
          type: [string, "null"]
        channel_connection_id:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, delivered, dead_letter]
        attempt_count:
          type: integer
        next_attempt_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds of the next retry, or `null`.
        response_status:
          type: [integer, "null"]
        duration_ms:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
        delivered_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if not delivered.
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
    WebhookTestResult:
      type: object
      required: [delivery_id, status]
      properties:
        delivery_id:
          type: string
        status:
          type: string
          const: queued
    ConnectLinkStatus:
      type: string
      enum: [pending, consumed, expired, revoked]
    ChannelConnectionState:
      type: string
      enum: [connecting, active, disconnected, disabled]
    CreateConnectLinkInput:
      type: object
      required: [channel_type]
      properties:
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        label:
          type: string
          maxLength: 100
          description: Display label shown on the hosted connect page.
        redirect_url:
          type: string
          format: uri
          maxLength: 2000
          description: >-
            URL the hosted page redirects to after a successful connect — must
            be https.
    ConnectLinkCreateResult:
      type: object
      required: [id, channel_type, label, status, expires_at]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
          description: >-
            Single-use hosted connect URL containing the one-time link token —
            present ONLY in the live create response. An idempotent replay of
            the create request omits it; the token can never be retrieved
            again.
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        label:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ConnectLinkStatus"
        expires_at:
          type: integer
          description: Unix timestamp in milliseconds.
    ConnectLink:
      type: object
      required:
        - id
        - channel_type
        - label
        - status
        - consumed_connection_ref
        - expires_at
        - created_at
      properties:
        id:
          type: string
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        label:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ConnectLinkStatus"
        consumed_connection_ref:
          type: [string, "null"]
          description: >-
            Stable ref of the connection created by consuming this link, or
            `null`.
        expires_at:
          type: integer
          description: Unix timestamp in milliseconds.
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
    ConnectLinkRevokeResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          const: revoked
    ChannelConnection:
      type: object
      required:
        - id
        - channel_type
        - label
        - state
        - masked_identity
        - last_activity_at
        - helpdesk_connection_id
      properties:
        id:
          type: string
        channel_type:
          $ref: "#/components/schemas/ChannelType"
        label:
          type: [string, "null"]
        state:
          $ref: "#/components/schemas/ChannelConnectionState"
        masked_identity:
          type: string
          description: Privacy-preserving identity handle (e.g. a masked phone number).
        last_activity_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never active.
        helpdesk_connection_id:
          type: [string, "null"]
          description: Linked helpdesk channel connection ID, or `null`.
    ChannelConnectionDisconnectResult:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          const: disconnected
