            - type: "null"
          description: DM / group / channel on personal-account channels; `null` elsewhere.
        chat_title:
          type: [string, "null"]
          description: The external group or channel title; `null` for DMs and business channels.
        message_count:
          type: integer
        unread_for_operator:
          type: integer
        last_message_at:
          type: integer
          description: Unix timestamp in milliseconds.
        last_message_preview:
          type: [string, "null"]
        last_message_author_type:
          anyOf:
            - $ref: "#/components/schemas/HelpdeskMessageAuthorType"
            - type: "null"
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
        updated_at:
          type: integer
          description: Unix timestamp in milliseconds.
    HelpdeskMessage:
      type: object
      required:
        - id
        - conversation_id
        - author_type
        - message_type
        - author_user_id
        - author_name
        - body
        - delivery_status
        - delivery_error
        - externally_deleted_at
        - created_at
      properties:
        id:
          type: string
        conversation_id:
          type: string
        author_type:
          $ref: "#/components/schemas/HelpdeskMessageAuthorType"
        message_type:
          $ref: "#/components/schemas/HelpdeskMessageType"
        author_user_id:
          type: [string, "null"]
        author_name:
          type: [string, "null"]
        body:
          type: string
        delivery_status:
          oneOf:
            - $ref: "#/components/schemas/HelpdeskMessageDeliveryStatus"
            - type: "null"
          description: >-
            Outbound delivery state, or `null` for inbound messages and
            internal notes. A `201` from `POST /api/v1/helpdesk/replies` means
            the reply was accepted, NOT delivered — the channel hand-off is
            asynchronous, so poll this field (or subscribe to
            `helpdesk.message_delivery_updated`) to learn the outcome.
        delivery_error:
          type: [string, "null"]
          description: >-
            Last send error for a `failed` outbound message, otherwise `null`.
        externally_deleted_at:
          type: [integer, "null"]
          description: >-
            Unix timestamp in milliseconds when the customer deleted the
            message on the external channel (Telegram today), otherwise
            `null`. The message is kept as a tombstone so the thread still
            reads in order, but its `body` is empty and any attachment has
            been erased — mirror the deletion in your own store. Also
            delivered as the `helpdesk.message_deleted` webhook event.
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
