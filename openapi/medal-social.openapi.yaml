    ScanCreateInput:
      type: object
      description: Provide exactly one of `url`, `orgnr`, or `name`.
      oneOf:
        - required: [url]
          not:
            anyOf: [{ required: [orgnr] }, { required: [name] }]
        - required: [orgnr]
          not:
            anyOf: [{ required: [url] }, { required: [name] }]
        - required: [name]
          not:
            anyOf: [{ required: [url] }, { required: [orgnr] }]
      properties:
        url:
          type: string
          minLength: 4
          maxLength: 500
        orgnr:
          type: string
          pattern: "^\\d{9}$"
        name:
          type: string
          minLength: 2
          maxLength: 120
    ScanCreateResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
        message:
          type: string
