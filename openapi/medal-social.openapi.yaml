      type: object
      required: [capability_id, preview_summary, user_approved]
      properties:
        capability_id:
          type: string
          minLength: 1
          maxLength: 160
          description: Confirmable capability to mint a token for.
        api_path:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Concrete `/api/v1/...` path to bind the token to. Optional when the
            capability has exactly one API target; required when it has several.
        path_params:
          type: object
          additionalProperties:
            type: [string, number, boolean]
          description: Values for the capability path template's parameters.
        idempotency_key:
          type: string
          minLength: 1
          description: >-
            The exact `Idempotency-Key` the confirmed write will send. The token
            is bound to it.
        preview_summary:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Human-readable description of the approved action, retained for
            audit.
        user_approved:
          const: true
          description: >-
            Asserts that a human on the caller's side approved this specific
            action.
    CapabilityConfirmation:
      type: object
      required:
        - confirmation_token
        - token_type
        - capability_id
        - method
        - path
        - required_scopes
        - idempotency_key
        - expires_in
        - expires_at
        - preview_summary
      properties:
        confirmation_token:
          type: string
          description: Send as the `X-Capability-Confirmation` header on the write.
        token_type:
          type: string
          const: medal_capability_confirmation
        capability_id:
          type: string
        method:
          type: string
        path:
          type: string
        required_scopes:
          type: array
          items:
            type: string
        idempotency_key:
          type: [string, "null"]
        expires_in:
          type: integer
          minimum: 60
          maximum: 900
        expires_at:
          type: string
          format: date-time
        preview_summary:
          type: string
