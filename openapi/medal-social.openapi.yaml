    DealCurrency:
      description: >-
        ISO-4217 codes a deal may carry. Closed: the API validates `currency`
        against exactly this list, so anything else is a 400.
      type: string
      enum: [USD, EUR, GBP, NOK]
    ChannelType:
      description: >-
        Channel types a hosted connect link can attach. Closed: the server
        resolves this through its connect adapter registry, which holds exactly
        these two.
      type: string
      enum: [telegram_inbox, linkedin]
