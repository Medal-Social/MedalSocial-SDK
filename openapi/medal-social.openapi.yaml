        from the live contact and person, not the booking's snapshot.
      type: object
      required:
        [
          booking_id,
          event_order,
          contact_id,
          contact_name,
          person_id,
          participant_name,
          participant_birth_year,
          service_id,
          resource_id,
          start_ts,
          status,
          amount_ore,
          payment_status,
        ]
      properties:
        booking_id:
          type: [string, "null"]
        event_order:
          type: [integer, "null"]
        contact_id:
          type: [string, "null"]
        contact_name:
          type: [string, "null"]
        person_id:
          type: [string, "null"]
        participant_name:
          type: [string, "null"]
        participant_birth_year:
          type: [integer, "null"]
        service_id:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        start_ts:
          type: [string, "null"]
          format: date-time
        status:
          oneOf:
            - $ref: "#/components/schemas/BookingStatus"
            - type: "null"
        amount_ore:
          type: [integer, "null"]
        payment_status:
          $ref: "#/components/schemas/BookingPaymentStatus"
    ListBookingEventRegistrationsResult:
      description: >-
        Result of `listBookingEventRegistrations` — an arrangement's roster,
        ordered by `event_order`. Capped at 300 rows; `truncated: true` means
        the ordering can no longer be trusted.
      type: object
      required: [registrations, truncated]
      properties:
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/BookingEventRegistration"
        truncated:
