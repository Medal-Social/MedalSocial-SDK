      properties:
        email:
          type: string
          format: email
          description: The address the code is sent to.
        locale:
          $ref: "#/components/schemas/PortalLocale"
    PortalLoginStartResult:
      description: >-
        Always `sent`, whether or not the address is a known contact — the
        route is enumeration-safe by design.
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: sent
    PortalVerifyInput:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The one-time code from the e-mail.
