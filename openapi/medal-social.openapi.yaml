          description: >-
            Show-once secret for the guardian's manage link. Only its hash is
            stored, and an idempotent replay omits this field entirely.
          type: string
        contact_id:
          description: The guardian's contact, created or reused.
          type: string
        person_id:
          description: The child's ContactPerson, created or reused.
          type: string
        payment:
          oneOf:
            - $ref: "#/components/schemas/BookingPaymentStart"
            - type: "null"
        payment_error:
          $ref: "#/components/schemas/BookingEventRegistrationPaymentError"
