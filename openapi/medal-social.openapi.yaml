        - start_ts
        - end_ts
        - service_id
        - service_name
        - resource_id
        - resource_name
        - booked_for_name
        - party_sequence_id
        - amount_ore
        - payment_status
        - payment_mode
        - time_zone
        - cancel_window_hours
        - reschedule_window_hours
        - can_cancel
        - can_reschedule
      properties:
        booking_id:
          type: string
        contact_id:
          type: [string, "null"]
        status:
          oneOf:
            - $ref: "#/components/schemas/BookingStatus"
            - type: "null"
        cancelled_by:
          oneOf:
            - $ref: "#/components/schemas/BookingCancelledBy"
            - type: "null"
        cancel_reason:
          type: [string, "null"]
        rescheduled_from_id:
          type: [string, "null"]
        start_ts:
          type: [string, "null"]
          format: date-time
        end_ts:
          type: [string, "null"]
          format: date-time
        service_id:
          type: [string, "null"]
        service_name:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        resource_name:
          type: [string, "null"]
        booked_for_name:
          type: [string, "null"]
        party_sequence_id:
          type: [string, "null"]
        amount_ore:
          description: Price in integer øre.
          type: [integer, "null"]
        payment_status:
          oneOf:
            - $ref: "#/components/schemas/BookingPaymentStatus"
            - type: "null"
        payment_mode:
          description: >-
            What this booking requires — what a manage page checks before
            offering «Betal nå».
          $ref: "#/components/schemas/BookingPaymentMode"
        time_zone:
          description: IANA zone the booking's local times should be rendered in.
          type: [string, "null"]
        cancel_window_hours:
          type: [number, "null"]
        reschedule_window_hours:
          type: [number, "null"]
        can_cancel:
          type: boolean
        can_reschedule:
          type: boolean
    UpdateBookingInput:
      description: >-
        At least one of `notes` or `internal_notes` is required — the API
        rejects a body carrying neither with a 400. `""` is a meaningful value
        that clears the field, so the constraint is on presence.
      # Spelled out as two fully-typed branches rather than the terser
      # `anyOf: [{required: [notes]}, {required: [internal_notes]}]`, because a
      # branch carrying only `required` generates as `unknown` — and `T |
      # unknown` collapses to `unknown`, which accepts everything and is worse
      # than the unconstrained object. Each branch therefore repeats the
      # properties so openapi-typescript emits a real discriminating union.
      #
      # `minProperties: 1` is deliberately absent: `anyOf` on two named
      # properties already implies it and is strictly stronger (it also rejects
      # `{ unrelated_key: 1 }`), so keeping both would be two statements of one
      # invariant to drift apart.
      anyOf:
        - type: object
          required: [notes]
          properties:
            notes:
              description: Customer-visible note.
              type: string
              maxLength: 5000
            internal_notes:
              description: Staff-only note.
              type: string
              maxLength: 5000
        - type: object
          required: [internal_notes]
          properties:
            notes:
              description: Customer-visible note.
              type: string
              maxLength: 5000
            internal_notes:
              description: Staff-only note.
              type: string
              maxLength: 5000
    CancelBookingInput:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    RescheduleBookingInput:
      type: object
      required: [new_start_ts]
      properties:
        new_start_ts:
          $ref: "#/components/schemas/BookingTimestampInput"
        new_resource_id:
          type: string
    StartBookingPaymentInput:
      description: >-
        Body for `startBookingPayment` and `startManageBookingPayment`.
      type: object
      required: [return_url, terms_accepted]
      properties:
        return_url:
          description: >-
            Where the wallet returns the customer. Must be a URL one of this
            workspace's own sites vouches for; anything else answers 422.
          type: string
          minLength: 1
          maxLength: 2048
        terms_accepted:
          description: >-
            Must be literally `true`. The customer has to actively accept the
            merchant's terms BEFORE a payment is initiated, so omitting it or
            sending `false` is a 400 and leaves no payment behind.
          const: true
          type: boolean
        terms_version:
          description: The caller's own version label for the terms that were accepted.
          type: string
          minLength: 1
          maxLength: 64
        terms_text:
          description: The exact text that was accepted, stored with the consent record.
          type: string
          maxLength: 2000
    BookingPaymentStart:
      description: >-
        The result of starting a payment. `redirect_url` is handed over here
        and nowhere else.
      type: object
      required: [reference, redirect_url, state]
      properties:
        reference:
          description: The wallet reference for this attempt.
          type: string
        redirect_url:
          description: >-
            Send the customer here UNCHANGED — hand it to the Vipps Widget SDK.
            SHOW-ONCE: it is not returned by `getBookingPayment`, and the
            payment behind it expires after ten minutes.
          type: string
        state:
          $ref: "#/components/schemas/BookingPaymentState"
    BookingPayment:
      description: >-
        One payment attempt on a booking. Money is integer øre, and the four
        aggregates are numbers rather than nulls — "nothing captured" is `0`.
        `redirect_url`, the wallet's own refusal text and the trace id are
        deliberately absent.
      type: object
      required:
        - reference
        - provider
        - state
        - mode
        - attempt
        - amount_ore
        - authorized_ore
        - captured_ore
        - refunded_ore
        - cancelled_ore
        - currency
        - capture_guaranteed_until
        - terms_version
        - terms_accepted_at
        - failure_code
        - created_at
        - updated_at
      properties:
        reference:
          type: string
        provider:
          const: vipps
          type: string
        state:
          $ref: "#/components/schemas/BookingPaymentState"
        mode:
          description: Never `none` — a payment exists only where one was required.
          type: string
          enum: [reserve, prepay]
        attempt:
          description: 1 for the first attempt on this booking, incrementing per retry.
          type: integer
        amount_ore:
          description: The amount this attempt is for, in integer øre.
          type: integer
        authorized_ore:
          type: integer
        captured_ore:
          type: integer
        refunded_ore:
          type: integer
        cancelled_ore:
          type: integer
        currency:
          const: NOK
          type: string
        capture_guaranteed_until:
          description: >-
            The last moment a capture is GUARANTEED to succeed. The card behind
            the wallet may release the reservation afterwards, so a capture
            past it can fail even though the payment still looks authorized.
            Null until the customer has approved.
          type: [string, "null"]
          format: date-time
        terms_version:
          type: [string, "null"]
        terms_accepted_at:
          type: [string, "null"]
          format: date-time
        failure_code:
          description: >-
            The wallet's numeric error code from the last failed operation —
            what a caller branches on.
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    BookingsPagination:
      description: >-
        Pagination for a bookings page. `truncated` is the extra statement:
        the underlying read is capped, and when the cap binds there are
        matching bookings no cursor from this call reaches — narrow the window.
      type: object
      required: [has_more, next_cursor, truncated]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
        truncated:
          type: boolean
    GdprExport:
