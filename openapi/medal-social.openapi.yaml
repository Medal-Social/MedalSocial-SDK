          $ref: "#/components/schemas/BookingPaymentMode"
        payment_status:
          $ref: "#/components/schemas/BookingPaymentStatus"
        notes:
          type: [string, "null"]
        manage_token:
          type: [string, "null"]
          description: >-
            Present only while the booking is upcoming and manageable; opens
            the site's manage page.
        can_manage:
          type: boolean
