    HelpdeskConversationStatus:
      type: string
      enum: [open, snoozed, closed]
    HelpdeskMessageAuthorType:
      type: string
      enum: [visitor, operator, ai, system]
    HelpdeskMessageType:
      type: string
      enum: [chat, email, note]
      description: >-
        `note` is operator-internal and never delivered to the customer.
    HelpdeskConversation:
      type: object
      required:
        - id
        - channel
        - channel_connection_id
        - status
        - subject
        - assignee_user_id
        - contact_id
        - visitor_name
        - visitor_email
        - external_conversation_id
        - channel_account_id
        - message_count
        - unread_for_operator
        - last_message_at
        - last_message_preview
        - last_message_author_type
        - created_at
        - updated_at
      properties:
        id:
          type: string
        channel:
          type: string
          description: >-
            Channel type, e.g. `widget`, `instagram`, `messenger`, `whatsapp`,
            `email`.
        channel_connection_id:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/HelpdeskConversationStatus"
        subject:
          type: [string, "null"]
        assignee_user_id:
          type: [string, "null"]
        contact_id:
          type: [string, "null"]
        visitor_name:
          type: [string, "null"]
        visitor_email:
          type: [string, "null"]
        external_conversation_id:
          type: [string, "null"]
        channel_account_id:
          type: [string, "null"]
        message_count:
          type: integer
        unread_for_operator:
          type: integer
        last_message_at:
          type: integer
          description: Unix timestamp in milliseconds.
        last_message_preview:
          type: [string, "null"]
        last_message_author_type:
          anyOf:
            - $ref: "#/components/schemas/HelpdeskMessageAuthorType"
            - type: "null"
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
        updated_at:
          type: integer
          description: Unix timestamp in milliseconds.
    HelpdeskMessage:
      type: object
      required:
        - id
        - conversation_id
        - author_type
        - message_type
        - author_user_id
        - author_name
        - body
        - delivery_status
        - delivery_error
        - created_at
      properties:
        id:
          type: string
        conversation_id:
          type: string
        author_type:
          $ref: "#/components/schemas/HelpdeskMessageAuthorType"
        message_type:
          $ref: "#/components/schemas/HelpdeskMessageType"
        author_user_id:
          type: [string, "null"]
        author_name:
          type: [string, "null"]
        body:
          type: string
        delivery_status:
          oneOf:
            - $ref: "#/components/schemas/HelpdeskMessageDeliveryStatus"
            - type: "null"
          description: >-
            Outbound delivery state, or `null` for inbound messages and
            internal notes. A `201` from `POST /api/v1/helpdesk/replies` means
            the reply was accepted, NOT delivered — the channel hand-off is
            asynchronous, so poll this field (or subscribe to
            `helpdesk.message_delivery_updated`) to learn the outcome.
        delivery_error:
          type: [string, "null"]
          description: >-
            Last send error for a `failed` outbound message, otherwise `null`.
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
    HelpdeskMessageDeliveryStatus:
      type: string
      enum: [pending, sent, delivered, failed]
    UpdateHelpdeskConversationInput:
      type: object
      minProperties: 1
      description: At least one field is required.
      properties:
        status:
          $ref: "#/components/schemas/HelpdeskConversationStatus"
        assignee_user_id:
          type: [string, "null"]
          description: User ID to assign, or `null` to unassign.
