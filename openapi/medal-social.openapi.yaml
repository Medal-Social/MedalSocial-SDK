      properties:
        conversation_id:
          type: string
        body:
          type: string
          maxLength: 20000
        message_type:
          type: string
          enum: [chat, note]
          description: >-
            `note` = operator-internal note (not delivered to the customer).
            Default `chat`.
        author_name:
          type: string
          description: >-
            Agent display name for bridged replies (shown in widget + inbox).
    HelpdeskReplyCreateResult:
      type: object
      required: [id, conversation_id, status]
      properties:
        id:
          type: string
        conversation_id:
          type: string
        status:
          type: string
          const: created
    WebhookEndpoint:
      type: object
      required:
        - id
        - name
        - url
        - enabled
        - event_types
        - channels
        - channel_connection_ids
        - secret_last4
        - consecutive_failures
        - last_delivery_at
        - last_success_at
        - last_error_at
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
          description: Destination URL (must be https).
        enabled:
          type: boolean
        event_types:
          type: array
          items:
            type: string
          description: Subscribed event types. Empty array = all events.
        channels:
          type: [array, "null"]
          items:
            type: string
          description: >-
            Channel-type filter (e.g. `['widget', 'whatsapp']`), or `null` for
            all channels.
        channel_connection_ids:
          type: [array, "null"]
          items:
            type: string
          description: Channel-connection filter, or `null` for all connections.
        secret_last4:
          type: string
          description: Last 4 characters of the signing secret, for identification.
        consecutive_failures:
          type: integer
        last_delivery_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_success_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_error_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if never.
        last_error:
          type: [string, "null"]
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
        updated_at:
          type: integer
          description: Unix timestamp in milliseconds.
        secret:
          type: string
          description: >-
            Full signing secret (`whsec_…`) — present ONLY in the create
            response, exactly once. It can never be retrieved again; store it
            securely immediately. An idempotent replay of the create request
            omits it.
    CreateWebhookInput:
      type: object
      required: [name, url, event_types]
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
          description: Destination URL — must be https.
        event_types:
          type: array
          items:
            type: string
          description: >-
            Event types to subscribe to (e.g. `helpdesk.message_received`).
            Empty = all.
        channels:
          type: array
          items:
            type: string
          description: Restrict to these channel types (e.g. `['widget', 'whatsapp']`).
        channel_connection_ids:
          type: array
          items:
            type: string
          description: Restrict to these channel connection IDs.
    UpdateWebhookInput:
      type: object
      description: Only provided fields change.
      properties:
        name:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        channels:
          type: [array, "null"]
          items:
            type: string
          description: New channel-type filter, or `null` to clear the filter.
        channel_connection_ids:
          type: [array, "null"]
          items:
            type: string
          description: New channel-connection filter, or `null` to clear the filter.
        enabled:
          type: boolean
    WebhookDeleteResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          const: deleted
    WebhookDelivery:
      type: object
      description: >-
        A delivery attempt record. `id` is the same value sent as the
        `X-Medal-Delivery-Id` and `Idempotency-Key` headers on the outbound
        request. Deliveries never carry payload bodies (payloads can contain
        customer PII). The correlation fields are derived from the stored event
        and fail closed to `null` when no canonical event exists — e.g.
        `test.ping` deliveries or events that have aged out of retention.
      required:
        - id
        - event_type
        - resource_id
        - conversation_id
        - message_id
        - connection_ref
        - channel
        - channel_connection_id
        - status
        - attempt_count
        - next_attempt_at
        - response_status
        - duration_ms
        - last_error
        - delivered_at
        - created_at
      properties:
        id:
          type: string
        event_type:
          type: string
        resource_id:
          type: [string, "null"]
          description: Primary subject id of the announced event, or `null`.
        conversation_id:
          type: [string, "null"]
        message_id:
          type: [string, "null"]
        connection_ref:
          type: [string, "null"]
        channel:
          type: [string, "null"]
        channel_connection_id:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, delivered, dead_letter]
        attempt_count:
          type: integer
        next_attempt_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds of the next retry, or `null`.
        response_status:
          type: [integer, "null"]
        duration_ms:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
        delivered_at:
          type: [integer, "null"]
          description: Unix timestamp in milliseconds, or `null` if not delivered.
        created_at:
          type: integer
          description: Unix timestamp in milliseconds.
    WebhookTestResult:
      type: object
      required: [delivery_id, status]
      properties:
        delivery_id:
          type: string
        status:
          type: string
          const: queued
