      type: object
      required: [name, birth_year]
      properties:
        name:
          type: string
        birth_year:
          type: integer
    PortalPerson:
      description: >-
        A person the contact books for — a child, a pet — with no login of
        its own.
      type: object
      required:
        [person_id, name, birth_year, relation_type, relation_label, notes, active]
      properties:
        person_id:
          type: string
        name:
          type: string
        birth_year:
          type: [integer, "null"]
        relation_type:
          $ref: "#/components/schemas/RelationType"
        relation_label:
          type: [string, "null"]
